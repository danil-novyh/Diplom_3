[pytest]
# Пути к тестам
testpaths = tests

# Паттерны файлов с тестами
python_files = test_*.py

# Паттерны классов с тестами
python_classes = Test*

# Паттерны функций-тестов
python_functions = test_*

# Маркеры для категоризации тестов
markers =
    smoke: Smoke tests (критически важная функциональность)
    regression: Regression tests (полное тестирование)
    slow: Медленные тесты
    skip_firefox: Пропустить в Firefox

# Опции запуска по умолчанию
addopts = 
    -v
    --strict-markers
    --tb=short
    --alluredir=allure-results
    --clean-alluredir

# Логирование
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
